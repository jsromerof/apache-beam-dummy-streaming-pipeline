kafka:
  consumer:
    config:
      bootstrap.servers: 'localhost:9092'
      auto.offset.reset: 'latest'
      default.api.timeout.ms: '120000'
    topics:
      - topic: "leyland_topic"
        consumer_group: k_itd_ren_saptm_dev_svc_dopcmst0_asicustomer
  producer:
    config:
      bootstrap.servers: 'localhost:9092'
    topic: 'australia_topic'
  secret:
      name: 'global_supplier_mdm_kafka'
      version: 'latest'

schema_standardization:
  - topic: "leyland_topic"
    standardization_mapping_file: "pipelines/global_supplier_to_retio/schema_standardization/leyland_mapping.yaml"

alloydb:
  database: 
    lineage: 'lineage'
  host: 'pos-d-ctd.enterprisedb.dev.cloud'
  port: 5432
  secret:
    name: 'global_supplier_mdm_alloydb'
    version: 'latest'